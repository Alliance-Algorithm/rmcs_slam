rmcs_map:
  ros__parameters:
    name:
      grid: "/rmcs_map/map/grid"
      node: "rmcs_map"
    switch:
      # 你想要去畸变吗
      undistort: true
      # 你想要发布点云吗，我可以提供完整点云和
      # 剔除掉地板的点云
      publish_cloud: true
      publish_test: false

    lidar:
      imu_extrinsic_translation: [ -0.011, -0.02329, 0.04412 ]
      imu_extrinsic_orientation: [ 1., 0., 0., 0. ]

      lid_topics: [
        "/livox/lidar_192_168_100_120",
        "/livox/lidar_192_168_100_174",
      ]
      imu_topics: [
        "/livox/imu_192_168_100_120",
        "/livox/imu_192_168_100_174",
      ]
      # 雷达原点在底盘坐标系的坐标
      # 单位是m，浮点数
      # x y z
      lidar_translations: [
        +0.14, +0.12, +0.27,
        -0.06602, -0.08964, +0.25121,
      ]
      # 描述了雷达坐标系如何旋转到底盘坐标系
      # 单位是度，浮点数
      # yaw pith roll
      lidar_orientations: [
        -49.7, 0.0, -50.0,
        179.33, -0.57, -51.38,
      ]

      # 单帧点云浮动比较大，多帧累积起来障碍物会拖长，
      # 以及未纠正到位的旋转畸变会叠加，但障碍地图会稳定很多
      livox_frames: 1

    segmentation:
      # 点云分割中迭代的最大相邻点的距离
      # 这个距离内的点云被视作统一平面内
      point_distance: 0.1
      # 点云分割中选取的高度
      ground_height: 0.2

    grid:
      # 栅格地图的分辨率，单位 m
      resolution: 0.02
      # 栅格地图边长，单位 m
      map_width: 10.1
      # 地图高度，单位 m
      map_height: 2.0
      # 雷达的盲区，球形直径
      lidar_blind: 1.2
      # 有效点数量阈值，出现在网格的点大于该数才视作有效
      points_limit: 5
      # 有效点高度区间阈值，障碍物栅格高度极值之差大于此值才视作有效
      height_limit: 0.06
      # 影响半径，一个点的高度信息可以影响的圆形区域
      # 为了弥补点云密度不够的补偿
      influence_radius: 0.00

    filter:
      # 预先膨胀，为了更好的闭合障碍物
      pre_dilate_size: 15
      pre_dilate_times: 0
      # 闭合，拟补激光雷达点云的缺口
      pre_close_size: 3
      pre_close_times: 0
      # 最后膨胀提升容错率
      dilate_size: 0
